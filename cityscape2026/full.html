<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<link rel="icon" href="../favicon.ico?v=20260924" sizes="256x256" type="image/x-icon">
<link rel="apple-touch-icon" href="../favicon.ico?v=20260924">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cityscape 2026 — Capstone Creatives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7EAEE; --paper-2:#DCE0E6; --card:#FFFFFF;
  --ink:#111820; --ink-2:#3A4652; --muted:#79848F;
  --line:#C9CFD7; --line-soft:#E4E8ED;
  --c-photo:#45828C; --c-carousel:#2E5F74; --c-reels:#0E5468; --c-story:#6E8A94; --c-brochure:#003850; --c-gallery:#3E6472;
  --brand-navy:#003850; --brand-teal:#45828C;
  --amber:#B4761B;
  --accent:var(--c-photo);
  --shadow:0 1px 2px rgba(17,24,32,.06), 0 12px 32px rgba(17,24,32,.10);
  --r:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3{font-family:"Archivo",system-ui,sans-serif;letter-spacing:-.02em}

/* ---------- chrome ---------- */
.rail{position:fixed;top:0;left:0;right:0;height:46px;z-index:60;display:flex;align-items:center;gap:16px;padding:0 22px;
  background:rgba(231,234,238,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.rail .brand{color:var(--ink);font-weight:600}
.rail .dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none;transition:background .3s}
.rail .mid{flex:1;text-align:center;color:var(--ink-2);letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail .count{color:var(--ink);font-weight:600}
.rail .hide-s{display:inline}
.progress{position:fixed;top:45px;left:0;height:2px;background:var(--accent);z-index:61;transition:width .3s ease,background .3s}

/* ---------- header project nav + theme toggle ---------- */
.rail .logo{flex:none;display:flex;align-items:center;margin-right:2px}
.rail .logo img{height:22px;width:auto;display:block}
.rail .logo .logo-d{display:none}
html[data-theme="dark"] .rail .logo .logo-l{display:none}
html[data-theme="dark"] .rail .logo .logo-d{display:block}
.rail .nav{position:relative;flex:none;display:flex;align-items:center}
.nav-inline{display:flex;gap:6px}
.nav-inline a{color:var(--ink-2);text-decoration:none;border:1px solid var(--line);border-radius:var(--r);
  padding:4px 10px;white-space:nowrap}
.nav-inline a:hover{color:var(--ink);border-color:var(--muted)}
.nav-inline a.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.nav-dd{display:none;position:relative}
@media (max-width:820px){
  .nav-inline{display:none}
  .nav-dd{display:block}
}
.nav-btn,.theme-btn{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--ink-2);
  background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:4px 10px;cursor:pointer}
.nav-btn:hover,.theme-btn:hover{color:var(--ink);border-color:var(--muted)}
.theme-btn{flex:none;font-size:13px;line-height:1;padding:3px 8px}
.nav-menu{display:none;position:absolute;top:calc(100% + 8px);left:0;min-width:220px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;z-index:70;text-transform:none;letter-spacing:0}
.nav.open .nav-menu{display:block}
.nav-menu a{display:block;padding:9px 12px;border-radius:var(--r);color:var(--ink);text-decoration:none;
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:13.5px}
.nav-menu a:hover{background:var(--paper)}
.nav-menu a.on{color:var(--accent);font-weight:600}
.nav-menu .sep{height:1px;background:var(--line-soft);margin:5px 4px}
.sold-tag{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--c-reels);border:1px solid currentColor;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.nav-inline a.is-sold{opacity:.6}
.rail-sold{flex:none;font-size:9px;font-weight:700;letter-spacing:.08em;color:var(--c-reels);
  border:1px solid currentColor;border-radius:3px;padding:2px 6px}
.dl-pick{min-width:340px}.dl-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px}
.dl-list{border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
.dl-row{display:flex;align-items:center;gap:11px;padding:11px 14px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line-soft)}
.dl-row:last-child{border-bottom:0}.dl-row:hover{background:var(--paper)}
.dl-row input{width:16px;height:16px;accent-color:var(--brand-teal,#45828C);cursor:pointer}
.dl-row span{flex:1}.dl-row em{font-style:normal;font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',monospace}
.dl-row.dl-all{background:var(--paper)}.dl-sep{height:0}
.admin-veil{position:fixed;inset:0;background:rgba(17,24,32,.5);z-index:120;display:grid;place-items:center}
.admin{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  padding:22px;min-width:320px;max-width:92vw;font-family:"IBM Plex Sans",system-ui,sans-serif}
.admin h3{font-size:15px;margin-bottom:14px}
.admin-row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:14px}
.admin-row select{font:inherit;padding:5px 8px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:var(--r)}
.admin-acts{display:flex;gap:8px;margin-top:16px}
.admin-note{margin-top:12px;font-size:11.5px;color:var(--muted)}

/* ---------- review comments ---------- */
.fb-fab{position:fixed;right:18px;bottom:58px;z-index:80;display:none;align-items:center;gap:8px;
  background:var(--brand-navy);color:#fff;border:0;border-radius:999px;padding:10px 16px;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase;box-shadow:var(--shadow)}
.fb-fab.show{display:flex}
.fb-fab b{background:#fff;color:var(--brand-navy);border-radius:999px;padding:1px 7px;font-size:10px}
.cmt-veil{position:fixed;inset:0;background:rgba(3,29,40,.5);z-index:120;display:grid;place-items:center;padding:16px}
.cmt{background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  padding:20px;width:520px;max-width:94vw;max-height:84vh;overflow:auto;font-family:"IBM Plex Sans",system-ui,sans-serif}
.cmt h3{font-size:15px;margin-bottom:2px}
.cmt .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.cmt textarea{width:100%;min-height:84px;padding:10px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--paper);color:var(--ink);font:inherit;font-size:13.5px;resize:vertical}
.cmt .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.cmt .note{border-top:1px solid var(--line-soft);padding:10px 0;font-size:13.5px}
.cmt .note .who{font-size:11px;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between;gap:10px}
.cmt .note .del{cursor:pointer;color:var(--c-reels);background:none;border:0;font-size:11px;padding:0}
.cmt .byc{font-size:12px;color:var(--muted);margin:8px 0 2px;letter-spacing:.05em;text-transform:uppercase}
.fbsec{max-width:1360px;margin:18px auto 0;border-top:1px solid var(--line);padding-top:14px;
  font-family:"IBM Plex Sans",system-ui,sans-serif}
.fbsec .fb-h{display:flex;align-items:center;gap:10px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px}.fbsec .fb-share{margin-left:auto;font-size:10.5px;padding:3px 9px;letter-spacing:.05em}

.fbsec .fb-h b{color:var(--accent)}
.fbsec .note{border-bottom:1px solid var(--line-soft);padding:9px 0;font-size:13.5px}
.fbsec .note .who{font-size:11px;color:var(--muted);margin-bottom:2px;display:flex;justify-content:space-between;gap:10px}
.fbsec .note .del{cursor:pointer;color:var(--c-reels);background:none;border:0;font-size:11px;padding:0}
.fbsec .fb-add{display:flex;gap:8px;margin-top:10px;align-items:flex-start}
.fbsec textarea{flex:1;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--card);color:var(--ink);font:inherit;font-size:13.5px;resize:vertical}
.fbsec .panelw{max-width:none;margin:0}
.panel .fbsec{margin-top:16px}
.has-notes{position:relative}
.has-notes::after{content:attr(data-n);position:absolute;top:-7px;right:-7px;background:var(--c-reels);color:#fff;
  border-radius:999px;font-size:9px;line-height:1;padding:3px 6px;font-family:"IBM Plex Mono",monospace}

/* ---------- dark theme ---------- */
html[data-theme="dark"]{
  --paper:#04222E; --paper-2:#062B3A; --card:#0A3345;
  --ink:#E9F0F3; --ink-2:#C0CFD6; --muted:#7E97A2;
  --line:#1D4A5C; --line-soft:#123B4B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.5);
}
html[data-theme="dark"] .rail{background:rgba(3,29,40,.9)}
html[data-theme="dark"] .doc-stage{background:#021823}
html[data-theme="dark"] .doc:fullscreen{background:#021823}
html[data-theme="dark"] .doc-stage img{box-shadow:0 2px 14px rgba(0,0,0,.6)}
html[data-theme="dark"] .bar{background:rgba(3,29,40,.9);border-top:1px solid var(--line)}
html[data-theme="dark"] .ui{background:var(--card);color:var(--ink);border-color:var(--line)}
html[data-theme="dark"] .ui.solid{background:var(--ink);color:var(--paper)}
.stage{position:absolute;inset:46px 0 44px;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:34px 44px 40px;
  opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .32s ease,transform .32s ease,visibility .32s}
.slide.on{opacity:1;visibility:visible;transform:none}
.bar{position:fixed;bottom:0;left:0;right:0;height:44px;z-index:60;display:flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(231,234,238,.88);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
button.ui{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  background:var(--card);color:var(--ink-2);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;cursor:pointer;transition:.15s}
button.ui:hover{border-color:var(--ink-2);color:var(--ink)}
button.ui:focus-visible,[tabindex]:focus-visible,.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.ui.solid{background:var(--ink);color:#fff;border-color:var(--ink)}
button.ui.solid:hover{background:var(--accent);border-color:var(--accent)}

/* ---------- shared type ---------- */
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
  display:flex;align-items:center;gap:9px;margin-bottom:14px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line);max-width:120px}
.tag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 8px;border-radius:2px;border:1px solid currentColor}
.lede{font-size:19px;color:var(--ink-2);max-width:56ch;line-height:1.5}
kbd{font-family:"IBM Plex Mono",monospace;font-size:10px;background:var(--paper-2);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:3px;padding:1px 5px;color:var(--ink-2)}

/* ---------- creative slide layout ---------- */
.ad-layout{display:grid;grid-template-columns:minmax(290px,380px) minmax(340px,1fr);gap:52px;max-width:1180px;margin:0 auto;align-items:start}
.ad-layout.tall{grid-template-columns:minmax(250px,318px) minmax(340px,1fr)}

/* ---------- instagram feed mock ---------- */
.ig{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ig-head{display:flex;align-items:center;gap:10px;padding:11px 12px}
.ig-av{width:32px;height:32px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--ink),var(--accent));color:#fff;
  display:grid;place-items:center;font-family:"Archivo";font-size:11px;font-weight:700}
.ig-who{line-height:1.25;min-width:0}
.ig-who b{font-size:13px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ig-who span{font-size:11px;color:var(--muted)}
.ig-dots{margin-left:auto;color:var(--muted);letter-spacing:1px;font-size:14px}
.cta-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#F1F3F5;border-top:1px solid var(--line-soft)}
.cta-bar .txt{min-width:0;line-height:1.3}
.cta-bar .txt b{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cta-bar .txt span{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.cta-bar .btn{margin-left:auto;flex:none;font-size:12px;font-weight:600;color:#0F62D6;white-space:nowrap}
.ig-acts{display:flex;align-items:center;gap:13px;padding:10px 12px 6px}
.ig-acts svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ig-acts .end{margin-left:auto}
.ig-acts .dots{display:flex;gap:5px;margin:0 auto}
.ig-acts .dots i{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .2s}
.ig-acts .dots i.on{background:#0F62D6}
.ig-cap{padding:6px 12px 14px;font-size:13px;line-height:1.5;color:var(--ink-2)}
.ig-cap b{color:var(--ink);font-weight:600}
.ig-cap .more{color:var(--muted)}

/* ---------- media slot ---------- */
.slot{position:relative;width:100%;background:var(--paper-2);overflow:hidden;display:block}
.slot[data-ratio="4:5"]{aspect-ratio:4/5}
.slot[data-ratio="1:1"]{aspect-ratio:1/1}
.slot[data-ratio="9:16"]{aspect-ratio:9/16}
.slot[data-ratio="16:9"]{aspect-ratio:16/9}
.slot > img,.slot > video{width:100%;height:100%;object-fit:cover;display:block}
.ph-slot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  background:repeating-linear-gradient(45deg,#DCE0E6,#DCE0E6 9px,#D5DAE1 9px,#D5DAE1 18px);
  border:1.5px dashed var(--muted);color:var(--ink-2);text-align:center;padding:14px}
.ph-slot .sz{font-family:"Archivo";font-size:19px;font-weight:700;letter-spacing:-.01em}
.ph-slot .fn{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;color:var(--ink-2);
  background:rgba(255,255,255,.75);padding:3px 7px;border-radius:2px;max-width:100%;overflow-wrap:anywhere}
.ph-slot .lb{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* ---------- carousel ---------- */
.car{position:relative;overflow:hidden}
.car-track{display:flex;height:100%;width:100%;transition:transform .34s cubic-bezier(.4,0,.2,1)}
.car-card{flex:0 0 100%;position:relative;height:100%}
.car-card > img{width:100%;height:100%;object-fit:cover;display:block}
.car-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:30px;height:30px;border-radius:50%;border:0;
  background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.22);cursor:pointer;display:grid;place-items:center;
  color:var(--ink);font-size:15px;line-height:1;padding:0;transition:.15s}
.car-nav:hover{background:#fff;transform:translateY(-50%) scale(1.08)}
.car-nav[disabled]{opacity:0;pointer-events:none}
.car-nav.prev{left:9px}.car-nav.next{right:9px}
.car-pos{position:absolute;top:10px;right:10px;z-index:4;background:rgba(0,0,0,.55);color:#fff;border-radius:11px;
  padding:2px 9px;font-size:11px;font-weight:600;font-family:"IBM Plex Sans"}
.card-strip{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.card-chip{flex:none;width:52px;border:1px solid var(--line);border-radius:3px;overflow:hidden;cursor:pointer;background:var(--card);
  padding:0;transition:.15s;position:relative}
.card-chip img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.card-chip .n{display:block;font-family:"IBM Plex Mono",monospace;font-size:9px;padding:2px 0;color:var(--muted);text-align:center}
.card-chip.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.card-chip .blank{width:100%;aspect-ratio:1/1;background:var(--paper-2);display:grid;place-items:center;
  font-family:"Archivo";font-size:13px;font-weight:700;color:var(--muted)}

/* ---------- brochure / document viewer ---------- */
.doc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.doc-bar{display:flex;align-items:center;gap:9px;padding:9px 11px;background:#F1F3F5;border-bottom:1px solid var(--line-soft);
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.doc-bar .nm{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.05em}
.doc-bar .pg{margin-left:auto;flex:none;color:var(--ink-2)}
.doc-stage{position:relative;background:#fff;display:grid;place-items:center;padding:16px;box-sizing:border-box;
  height:min(72vh,760px);grid-template-rows:minmax(0,1fr);overflow:hidden}
.doc-stage img{max-width:100%;max-height:100%;width:auto;height:auto;min-height:0;object-fit:contain;display:block;
  box-shadow:0 2px 12px rgba(0,0,0,.12);background:#fff}
.doc-stage .ph-slot{position:absolute;inset:16px;border-radius:2px}
.doc-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:30px;height:30px;border-radius:50%;border:0;
  background:rgba(255,255,255,.94);box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer;display:grid;place-items:center;
  color:var(--ink);font-size:15px;line-height:1;padding:0;transition:.15s}
.doc-nav:hover{background:#fff;transform:translateY(-50%) scale(1.08)}
.doc-nav[disabled]{opacity:0;pointer-events:none}
.doc-nav.prev{left:8px}.doc-nav.next{right:8px}
.doc-strip{display:flex;gap:5px;overflow-x:auto;padding:9px;background:#F1F3F5;border-top:1px solid var(--line-soft);
  scrollbar-width:thin}
.doc-strip button{flex:none;width:38px;padding:0;border:1px solid var(--line);border-radius:2px;background:#fff;cursor:pointer;
  transition:.14s;line-height:0}
.doc-strip button img{width:100%;display:block}
.doc-strip button.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.doc-strip button:hover{border-color:var(--ink-2)}
.doc-ph{width:100%;aspect-ratio:16/10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  background:repeating-linear-gradient(45deg,#DCE0E6,#DCE0E6 9px,#D5DAE1 9px,#D5DAE1 18px);
  border:1.5px dashed var(--muted);color:var(--ink-2);text-align:center;padding:14px}

/* ---------- story + reels (9:16) ---------- */
.vert{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);background:#20262E}
.vert .slot{border-radius:0}
.vert .top{position:absolute;top:0;left:0;right:0;padding:11px 12px;display:flex;align-items:center;gap:9px;z-index:3;
  background:linear-gradient(rgba(0,0,0,.5),transparent)}
.vert .top .ig-av{width:26px;height:26px;font-size:9px}
.vert .top .nm{color:#fff;font-size:12px;font-weight:600;line-height:1.2}
.vert .top .nm span{display:block;font-weight:400;font-size:10px;opacity:.85}
.vert .lines{position:absolute;top:5px;left:12px;right:12px;display:flex;gap:3px;z-index:4}
.vert .lines i{flex:1;height:2px;background:rgba(255,255,255,.35);border-radius:2px}
.vert .lines i:first-child{background:#fff}
.vert .bottom{position:absolute;bottom:0;left:0;right:0;padding:16px 14px 18px;z-index:3;
  background:linear-gradient(transparent,rgba(0,0,0,.62))}
.vert .pill{display:flex;align-items:center;justify-content:center;gap:7px;background:#fff;color:var(--ink);
  font-size:12.5px;font-weight:600;padding:9px;border-radius:7px}

const _MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function _dateKey(c){ const s=String(c.updated||c.added||'').trim(); const m=s.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})$/); if(!m) return 0; return Number(m[3])*10000+(_MON[m[2].toLowerCase()]||0)*100+Number(m[1]); }
function byNewest(list){ return list.map((c,i)=>[c,i]).sort((a,b)=>(_dateKey(b[0])-_dateKey(a[0]))||(a[1]-b[1])).map(x=>x[0]); }

const has = v => v && String(v).trim().length>0;

const isVid = c => c.type==='reels' || c.type==='construction' || c.type==='walkthrough' || (c.type==='story' && has(c.src) && String(c.src).startsWith('data:video'));

/* A data: URI can't be range-requested, so browsers won't seek it and some
   sandboxed viewers refuse it for media entirely.  Decode once to a blob and
   hand the video element a blob: URL instead.  Lazy — decoding megabytes of
   base64 up front would stall the first paint. */
const blobs = new Map();
function blobFor(c){
  if(blobs.has(c.id)) return blobs.get(c.id);
  let url;
  try{
    const [meta, data] = c.src.split(',');
    const mime = meta.slice(5).split(';')[0] || 'video/mp4';
    const bin  = atob(data);
    const buf  = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
    url = URL.createObjectURL(new Blob([buf], {type:mime}));
  }catch(err){
    console.warn('blob conversion failed, falling back to data URI', err);
    url = c.src;
  }
  blobs.set(c.id, url);
  return url;
}

/* placeholder shown wherever an asset has not landed yet */
function placeholder(ratio, file, note){
  return `<div class="ph-slot">
    <div class="lb">${esc(note||'Awaiting asset')}</div>
    ${ratio?`<div class="sz">${SPEC[ratio]||ratio}</div>`:''}
    ${file?`<div class="fn">${esc(file)}</div>`:''}
    ${ratio?`<div class="lb">${esc(ratio)}</div>`:''}
  </div>`;
}

function mediaNode(c){
  const s = el(`<div class="slot" data-ratio="${c.ratio}"></div>`);
  if(!has(c.src)){ s.innerHTML = placeholder(c.ratio, c.file); return s; }
  let m;
  if(isVid(c)){
    m = document.createElement('video');
    m.controls=true; m.playsInline=true; m.preload='none';
    if(has(c.poster)) m.poster=c.poster;
    m.dataset.cid = c.id;              // src attached on first view
  } else {
    m = document.createElement('img');
    m.alt = c.name || c.id;
    m.loading = 'lazy';
    m.src = c.src;
  }
  s.appendChild(m);
  return s;
}

function ensureVideo(slide){
  const v = slide && slide.querySelector('video[data-cid]');
  if(!v || v.src) return;
  const c = CREATIVES.find(x=>x.id===v.dataset.cid);
  if(c && has(c.src)){ v.src = blobFor(c); v.load(); }
}

/* agent-facing: pull the actual asset back out of the deck as a real file */
function baseName(path, fallback){
  if(!has(path)) return fallback || 'download';
  const parts = String(path).split('/');
  return parts[parts.length-1] || fallback || 'download';
}
function downloadAsset(href, filename){
  if(!has(href)) return;
  const a = document.createElement('a');
  a.href = href; a.download = filename || 'download'; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
}

/* ---------- Download all creatives, zipped into per-type folders ---------- */
const TYPE_FOLDER = { brochure:'Brochure', photo:'Social - Statics', carousel:'Social - Carousels',
  reels:'Reels', story:'Stories', walkthrough:'Walkthroughs', construction:'Construction Updates', gallery:'Gallery', wati:'WATI Campaign' };
async function fetchAsBlob(url){ const r = await fetch(url); if(!r.ok) throw new Error(url); return await r.blob(); }
function dataURLtoBlob(u){ const [h,b]=u.split(','); const mime=(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream';
  const bin=atob(b); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime}); }
function extFor(file, fallback){ const m=String(file||'').match(/\.[a-z0-9]+$/i); return m?m[0]:fallback; }
function _bn(file, fb){ try { return (typeof baseName==='function') ? baseName(file, fb) : (String(file||'').split('/').pop()||fb); } catch(e){ return fb; } }
function _catLabel(k){ try { return (typeof catLabel==='function') ? catLabel(k) : k; } catch(e){ return k; } }

/* ---------- Download picker: choose which content types to include ---------- */
const TYPE_LABEL = { brochure:'Brochure', photo:'Social statics', carousel:'Carousels',
  reels:'Reels', story:'Stories', walkthrough:'Walkthroughs', construction:'Construction updates', gallery:'Gallery', wati:'WATI Campaign' };
function _typeCount(t){
  let n=0;
  for(const c of CREATIVES){ if(c.type!==t) continue;
    if(t==='carousel') n+=(c.cards||[]).filter(x=>has(x.src)).length;
    else if(t==='gallery') n+=(c.photos||[]).filter(x=>has(x.src)).length;
    else if(t==='brochure') n+=(has(c.pdf)||has(c.pdfHref))?1:0;
    else n+=has(c.src)?1:0;
  }
  return n;
}
function openDownloadPicker(){
  const order=['brochure','photo','carousel','reels','story','walkthrough','construction','gallery'];
  const present=order.filter(t=>t!=='flipbook' && _typeCount(t)>0);
  if(!present.length){ toast('Nothing to download'); return; }
  const rows=present.map(t=>`<label class="dl-row"><input type="checkbox" data-t="${t}" checked>
      <span>${esc(TYPE_LABEL[t]||t)}</span><em>${_typeCount(t)}</em></label>`).join('');
  const veil=el(`<div class="admin-veil"><div class="admin dl-pick">
    <h3>Download creatives</h3>
    <p class="dl-sub">Choose what to include. Each type lands in its own folder inside the .zip.</p>
    <div class="dl-list">
      <label class="dl-row dl-all"><input type="checkbox" id="dlAll" checked><span><b>All types</b></span><em></em></label>
      <div class="dl-sep"></div>
      ${rows}
    </div>
    <div class="admin-acts">
      <button class="ui solid dl-go">Download .zip</button>
      <button class="ui dl-close">Cancel</button>
    </div>
  </div></div>`);
  document.body.appendChild(veil);
  const boxes=[...veil.querySelectorAll('input[data-t]')];
  const allBox=veil.querySelector('#dlAll');
  const sync=()=>{ allBox.checked = boxes.every(b=>b.checked);
    allBox.indeterminate = !allBox.checked && boxes.some(b=>b.checked); };
  allBox.addEventListener('change',()=>{ boxes.forEach(b=>b.checked=allBox.checked); });
  boxes.forEach(b=>b.addEventListener('change',sync));
  veil.addEventListener('click',e=>{ if(e.target===veil) veil.remove(); });
  veil.querySelector('.dl-close').addEventListener('click',()=>veil.remove());
  veil.querySelector('.dl-go').addEventListener('click',()=>{
    const allowed=new Set(boxes.filter(b=>b.checked).map(b=>b.dataset.t));
    if(!allowed.size){ toast('Pick at least one type'); return; }
    veil.remove(); downloadProjectZip(allowed);
  });
}

async function downloadProjectZip(allowed){
  if(typeof JSZip==='undefined'){ toast('Zip library not loaded'); return; }
  const _ok = t => !allowed || allowed.has(t);
  const btn=document.getElementById('dlProject'); const label=btn?btn.textContent:'';
  if(btn) btn.disabled=true;
  const zip=new JSZip(); let n=0, total=0; const jobs=[];
  const add=(folder, name, getter)=>{ total++; jobs.push({folder,name,getter}); };
  for(const c of CREATIVES){
    if(!_ok(c.type)) continue;
    const folder = TYPE_FOLDER[c.type] || 'Other';
    if(c.type==='brochure'){
      if(has(c.pdf)||has(c.pdfHref)) add(folder, _bn(c.file, c.id+'.pdf'), ()=> (c.pdf?dataURLtoBlob(c.pdf):fetchAsBlob(c.pdfHref)));
    } else if(c.type==='carousel'||c.type==='wati'){
      (c.cards||[]).forEach((cd,i)=>{ if(has(cd.src)) add(folder, _bn(cd.file, c.id+'-slide-'+(i+1)+extFor(cd.file,'.png')), ()=> (String(cd.src).startsWith('data:')?dataURLtoBlob(cd.src):fetchAsBlob(cd.src))); });
    } else if(c.type==='gallery'){
      (c.photos||[]).forEach((pd,i)=>{ if(has(pd.src)){
        const sub = pd.group ? folder+'/'+pd.group : (pd.category ? folder+'/'+_catLabel(pd.category) : folder);
        add(sub, _bn(pd.file, c.id+'-'+String(i+1).padStart(3,'0')+'.jpg'), ()=> (String(pd.src).startsWith('data:')?dataURLtoBlob(pd.src):fetchAsBlob(pd.src))); } });
    } else if(isVid(c)){
      if(has(c.src)) add(folder, _bn(c.file, c.id+'.mp4'), ()=> (String(c.src).startsWith('data:')?dataURLtoBlob(c.src):fetchAsBlob(c.src)));
    } else if(c.type==='photo'){
      if(has(c.src)) add(folder, _bn(c.file, c.id+extFor(c.file,'.jpg')), ()=> (String(c.src).startsWith('data:')?dataURLtoBlob(c.src):fetchAsBlob(c.src)));
    }
  }
  if(!total){ toast('Nothing to download'); if(btn){btn.disabled=false;btn.textContent=label;} return; }
  for(const j of jobs){
    try{ const blob=await j.getter(); zip.folder(j.folder).file(j.name, blob); n++;
      if(btn) btn.textContent='Packaging… '+n+'/'+total; }
    catch(e){}
  }
  if(btn) btn.textContent='Zipping…';
  const out=await zip.generateAsync({type:'blob'});
  const url=URL.createObjectURL(out);
  downloadAsset(url, (CAMPAIGN.handle||CAMPAIGN.project||'creatives').replace(/\s+/g,'-')+'-creatives.zip');
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  toast('Downloaded '+n+' file'+(n===1?'':'s'));
  if(btn){ btn.disabled=false; btn.textContent=label; }
}


/* Published-artifact / embedded-viewer mode: when the deck runs inside a
   sandboxed iframe (e.g. a shared Claude artifact link), the browser blocks
   programmatic downloads, so the download buttons would be dead weight.
   Detect the embedded case and hide them, leaving viewing fully intact. */
const EMBEDDED = (()=>{ try { return window.self !== window.top; } catch(e){ return true; } })();
if(EMBEDDED){
  const st = document.createElement('style');
  st.textContent = '.dlone,.dlall,.dlpage,.dlpdf,.download,.dlproject,.dlcards{display:none!important}';
  document.head.appendChild(st);
}

/* Small helper for thumbnail <img> tags. A brochure strip or photo grid can
   carry 30+ tiles on screen at once — the real fix for that is the small
   `thumb` copy the builder generates alongside the full-res `src` (see
   THUMB_PX in build.py), so decoding all of them is cheap regardless of
   scroll position. `loading="lazy"` is left on as a harmless native hint. */
function lazyImg(src, alt){
  const img = document.createElement('img');
  if(alt) img.alt = alt;
  img.loading = 'lazy';
  img.src = src;
  return img;
}

const counter = (t,l) => { const n = has(t)?t.length:0; return `<span class="n ${n>l?'warn':''}">${n} / ${l}</span>`; };
function truncated(t,l){
  if(!has(t)) return '<span class="ph">Copy goes here.</span>';
  if(t.length<=l) return esc(t);
  return esc(t.slice(0,l)) + `<span class="cut">${esc(t.slice(l))}</span>`;
}
const firstLine = t => has(t) ? String(t).split('\n')[0] : '';

/* ---------- carousel ---------- */
function carouselNode(c, onChange){
  const cards = c.cards && c.cards.length ? c.cards : [{}];
  const s = el(`<div class="slot car" data-ratio="${c.ratio}">
    <div class="car-track"></div>
    <div class="car-pos">1/${cards.length}</div>
    <button class="car-nav prev" aria-label="Previous card">‹</button>
    <button class="car-nav next" aria-label="Next card">›</button>
  </div>`);
  const track = s.querySelector('.car-track');
  cards.forEach((cd,i)=>{
    const card = el(`<div class="car-card"></div>`);
    if(has(cd.src)) card.appendChild(lazyImg(cd.src, cd.headline||('Card '+(i+1))));
    else card.innerHTML = placeholder(c.ratio, cd.file, `Card ${i+1} of ${cards.length}`);
    track.appendChild(card);
  });
  const pos=s.querySelector('.car-pos'), prev=s.querySelector('.car-nav.prev'), next=s.querySelector('.car-nav.next');
  let i=0;
  function set(n){
    i = Math.max(0, Math.min(cards.length-1, n));
    track.style.transform = `translateX(-${i*100}%)`;
    pos.textContent = `${i+1}/${cards.length}`;
    prev.disabled = i===0; next.disabled = i===cards.length-1;
    onChange && onChange(i);
  }
  prev.onclick=()=>set(i-1); next.onclick=()=>set(i+1);
  /* drag / swipe */
  let x0=null;
  s.addEventListener('pointerdown',e=>{ if(e.target.closest('.car-nav'))return; x0=e.clientX; });
  s.addEventListener('pointerup',e=>{ if(x0===null)return; const d=e.clientX-x0; x0=null;
    if(Math.abs(d)>36) set(i + (d<0?1:-1)); });
  set(0);
  s.goto = set;
  return s;
}

/* ---------- brochure / document pager ---------- */
function docNode(c, onChange){
  const pages = c.pages && c.pages.length ? c.pages : [{}];
  const s = el(`<div class="doc">
    <div class="doc-bar"><span class="nm">${esc(c.file||c.name||'Document')}</span><span class="pg">1 / ${pages.length}</span></div>
    <div class="doc-stage">
      <button class="doc-nav prev" aria-label="Previous page">‹</button>
      <button class="doc-nav next" aria-label="Next page">›</button>
    </div>
    <div class="doc-strip"></div>
  </div>`);
  const stage = s.querySelector('.doc-stage'), pg = s.querySelector('.pg'),
        prev = s.querySelector('.doc-nav.prev'), next = s.querySelector('.doc-nav.next'),
        strip = s.querySelector('.doc-strip');
  let img = null;
  pages.forEach((pd,i)=>{
    const b = el(`<button data-i="${i}" aria-label="Page ${i+1}"></button>`);
    if(has(pd.src)) b.appendChild(lazyImg(pd.thumb||pd.src, `Page ${i+1}`));
    else b.appendChild(el(`<div class="doc-ph"></div>`));
    b.addEventListener('click', ()=>set(i));
    strip.appendChild(b);
  });
  const thumbs = [...strip.children];
  let i=0;
  function set(n){
    i = Math.max(0, Math.min(pages.length-1, n));
    const pd = pages[i];
    stage.querySelectorAll('img,.doc-ph').forEach(x=>x.remove());
    if(has(pd.src)){ img = document.createElement('img'); img.src = pd.src; img.alt = `Page ${i+1}`; stage.appendChild(img); }
    else stage.appendChild(el(placeholder('', pd.file, `Page ${i+1} of ${pages.length}`)));
    pg.textContent = `${i+1} / ${pages.length}`;
    prev.disabled = i===0; next.disabled = i===pages.length-1;
    thumbs.forEach((t,n)=>t.classList.toggle('on', n===i));
    thumbs[i]?.scrollIntoView({inline:'nearest', block:'nearest'});
    s.cur = i;
    onChange && onChange(i);
  }
  prev.onclick=()=>set(i-1); next.onclick=()=>set(i+1);
  set(0);
  s.goto = set;
  s.count = pages.length;
  return s;
}

function docPreview(c){
  const col = T(c).col;
  const pages = c.pages && c.pages.length ? c.pages : [];
  const wrap = el(`<div><div class="holder"></div>
    <div class="frame-spec">
      <span class="tag" style="color:${col}">${T(c).label}</span>
      <span>${pages.length} page${pages.length===1?'':'s'}</span>
      ${has(c.file)?`<span>·</span><span>${esc(c.file)}</span>`:''}
    </div>
  </div>`);
  const doc = docNode(c, i=>wrap.dispatchEvent(new CustomEvent('card', {detail:i, bubbles:false})));
  wrap.querySelector('.holder').replaceWith(doc);
  wrap.goto = doc.goto;
  return wrap;
}

/* ---------- gallery: categorized photo set ---------- */
function galleryNode(c, onChange){
  const photos = c.photos && c.photos.length ? c.photos : [{}];
  const s = el(`<div class="doc">
    <div class="doc-bar"><span class="nm">Photo gallery</span><span class="pg">1 / ${photos.length}</span></div>
    <div class="doc-stage">
      <button class="doc-nav prev" aria-label="Previous photo">‹</button>

  const stage = s.querySelector('.doc-stage'), pg = s.querySelector('.pg'), nm = s.querySelector('.nm'),
        prev = s.querySelector('.doc-nav.prev'), next = s.querySelector('.doc-nav.next');
  let i = 0;
  function set(n){
    i = Math.max(0, Math.min(photos.length - 1, n));
    const pd = photos[i] || {};
    const cat = GALLERY_CATS.find(g=>g.key===pd.category);
    stage.querySelectorAll('img,.doc-ph').forEach(x=>x.remove());

    pg.textContent = `${i+1} / ${photos.length}`;
    prev.disabled = i===0; next.disabled = i===photos.length-1;
    s.cur = i;
    onChange && onChange(i);
  }
  prev.onclick = () => set(i-1); next.onclick = () => set(i+1);
  set(0);
  s.goto = set;
  s.count = photos.length;
  return s;
}

function gallerySlide(c){
  const col = T(c).col;
  const s = el(`<section class="slide brochure-view" style="--accent:${col}"></section>`);
  /* keep photos in category order regardless of manifest listing order */
  if(c.photos && c.photos.length){
    const ord = Object.fromEntries(GALLERY_CATS.map((g,i)=>[g.key,i]));
    c.photos = [...c.photos].sort((a,b)=>(ord[a.category]??99)-(ord[b.category]??99));
  }
  const photos = c.photos && c.photos.length ? c.photos : [];
  const hasAsset = photos.some(x=>has(x.src));
  const catLabel = k => (GALLERY_CATS.find(g=>g.key===k)||{}).label || '';

  /* header: title, category filter pills, actions */
  const cats = GALLERY_CATS.map(g=>({...g, n: photos.filter(p=>p.category===g.key).length})).filter(g=>g.n);
  const head = el(`<div class="gal-head">
    <h2 dir="auto">${esc(c.name)} <span class="count">· ${photos.length} photos</span></h2>
    <div class="gal-cats">
      <button class="gal-cat-btn on" data-cat="">All</button>
      ${cats.map(g=>`<button class="gal-cat-btn" data-cat="${esc(g.key)}">${esc(g.label)} <span>${g.n}</span></button>`).join('')}
    </div>
    ${(()=>{const gs=[...new Set(photos.map(p=>p.group).filter(Boolean))];
      return gs.length?`<div class="gal-cats gal-groups">
        <button class="gal-grp-btn on" data-grp="">All units</button>
        ${gs.map(g=>`<button class="gal-grp-btn" data-grp="${esc(g)}">${esc(g)} <span>${photos.filter(p=>p.group===g).length}</span></button>`).join('')}
      </div>`:''})()}
    ${photos.length>1 && hasAsset?'<button class="ui dlall">Download all</button>':''}
    <button class="ui gohome">All creatives</button>
  </div>`);

  /* justified mosaic wall */
  const wall = el(`<div class="mosaic"></div>`);
  photos.forEach((pd,i)=>{
    const t = el(`<button class="gal-tile" data-i="${i}" data-cat="${esc(pd.category||'')}" data-grp="${esc(pd.group||'')}" title="${esc((pd.group?pd.group+' · ':'')+catLabel(pd.category))}"></button>`);
    if(has(pd.src)){
      const img = lazyImg(pd.thumb||pd.src, catLabel(pd.category));
      img.addEventListener('load', ()=>{ if(img.naturalWidth&&img.naturalHeight) t.style.setProperty('--ar', (img.naturalWidth/img.naturalHeight).toFixed(3)); }, {once:true});
      if(img.complete && img.naturalWidth) t.style.setProperty('--ar', (img.naturalWidth/img.naturalHeight).toFixed(3));
      t.appendChild(img);
    }
    t.addEventListener('click', ()=>lbOpen(i));
    wall.appendChild(t);
  });

  /* category + unit filters (combined) */
  let fCat = '', fGrp = '';
  function applyFilter(){
    wall.querySelectorAll('.gal-tile').forEach(t=>t.classList.toggle('hide',
      (!!fCat && t.dataset.cat!==fCat) || (!!fGrp && t.dataset.grp!==fGrp)));
  }
  head.querySelectorAll('.gal-cat-btn').forEach(b=>b.addEventListener('click', ()=>{
    head.querySelectorAll('.gal-cat-btn').forEach(x=>x.classList.toggle('on', x===b));
    fCat = b.dataset.cat; applyFilter();
  }));
  head.querySelectorAll('.gal-grp-btn').forEach(b=>b.addEventListener('click', ()=>{
    head.querySelectorAll('.gal-grp-btn').forEach(x=>x.classList.toggle('on', x===b));
    fGrp = b.dataset.grp; applyFilter();
  }));

  /* lightbox */
  const lb = el(`<div class="lb">
    <div class="lb-cap"></div>
    <div class="lb-stage"><img alt=""></div>
    <button class="lb-nav lb-prev">‹</button>
    <button class="lb-nav lb-next">›</button>
    <button class="ui lb-x">Close</button>
    <div class="lb-bar"><span class="lb-n"></span>${hasAsset?'<button class="ui lb-dl">Download</button>':''}</div>
  </div>`);
  let cur = 0;
  const visible = () => [...wall.querySelectorAll('.gal-tile:not(.hide)')].map(t=>Number(t.dataset.i));
  function lbShow(){
    const pd = photos[cur]||{};
    lb.querySelector('.lb-stage img').src = pd.src||'';
    lb.querySelector('.lb-cap').textContent = `${catLabel(pd.category)}`;
    lb.querySelector('.lb-n').textContent = `${cur+1} / ${photos.length}`;
  }
  function lbOpen(i){ cur=i; lbShow(); lb.classList.add('open'); }
  function lbClose(){ lb.classList.remove('open'); }
  function lbStep(d){
    const vis = visible().length ? visible() : photos.map((_,i)=>i);
    const pos = Math.max(0, vis.indexOf(cur));
    const next = vis[(pos + d + vis.length) % vis.length];
    cur = next; lbShow();
  }
  lb.querySelector('.lb-x').addEventListener('click', lbClose);
  lb.querySelector('.lb-prev').addEventListener('click', ()=>lbStep(-1));
  lb.querySelector('.lb-next').addEventListener('click', ()=>lbStep(1));
  lb.querySelector('.lb-dl')?.addEventListener('click', ()=>{
    const pd = photos[cur]||{};
    downloadAsset(pd.src, baseName(pd.file, `${c.id}-${String(cur+1).padStart(2,'0')}.jpg`));
    toast('Downloading photo');
  });
  lb.addEventListener('click', e=>{ if(e.target===lb || e.target.classList.contains('lb-stage')) lbClose(); });
  s.lb = { isOpen: ()=>lb.classList.contains('open'), step: lbStep, close: lbClose };

  head.querySelector('.gohome').addEventListener('click', goHome);
  head.querySelector('.dlall')?.addEventListener('click', ()=>{
    let n = 0;
    photos.forEach((pd,i)=>{ if(!has(pd.src)) return; const j=n++;
      setTimeout(()=>downloadAsset(pd.src, baseName(pd.file, `${c.id}-${String(i+1).padStart(2,'0')}.jpg`)), j*140); });
    toast(`Downloading ${photos.filter(x=>has(x.src)).length} photos`);
  });

  s.append(head, wall, feedbackSection(c), lb);
  s.dataset.title = `${c.id} — ${c.name||''}`;
  s.dataset.type  = c.type;
  return s;
}

}
function feedCaption(c){

    esc(String(c.primary||'').replace(/\n/g,' ').slice(0,LIMITS.primary)) +

/* photo + carousel share the feed frame; carousel adds dots and per-card CTA */
function feedPreview(c){
  const col = T(c).col;
  const cards = (c.type==='carousel'||c.type==='wati') ? (c.cards&&c.cards.length?c.cards:[{}]) : null;
  const wrap = el(`<div>
    <div class="ig">
      ${feedHead()}
      <div class="holder"></div>
      <div class="cta-bar">
        <div class="txt">
          <b dir="auto" class="ch">${esc(c.headline)}</b>
          <span dir="auto" class="cd">${esc(c.description)}</span>
        </div>
        <div class="btn">${esc(c.cta||'Call to action')} ›</div>
      </div>
      <div class="ig-acts">${ICONS.heart}${ICONS.comment}${ICONS.send}
        ${cards?`<span class="dots">${cards.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</span>`:''}
        <span class="end">${ICONS.save}</span></div>
      ${feedCaption(c)}
    </div>
    <div class="frame-spec">
      <span class="tag" style="color:${col}">${T(c).label}</span>
      <span>${SPEC[c.ratio]||c.ratio}</span><span>·</span><span>${esc(c.ratio)}</span>
      <span>·</span><span>${esc(c.placement||'Feed')}</span>
      ${cards?`<span>·</span><span>${cards.length} cards</span>`:''}
    </div>
  </div>`);

  if(cards){
    const dots = [...wrap.querySelectorAll('.ig-acts .dots i')];
    const hEl = wrap.querySelector('.ch'), dEl = wrap.querySelector('.cd');
    const car = carouselNode(c, i=>{
      dots.forEach((d,n)=>d.classList.toggle('on',n===i));
      const cd = cards[i]||{};
      hEl.textContent = cd.headline || c.headline || '';
      dEl.textContent = cd.description || c.description || '';
      wrap.dispatchEvent(new CustomEvent('card', {detail:i, bubbles:false}));
    });
    wrap.querySelector('.holder').replaceWith(car);
    wrap.goto = car.goto;
  } else {
    wrap.querySelector('.holder').replaceWith(mediaNode(c));
  }
  return wrap;
}

/* story + reels share the 9:16 frame, differing in chrome */
function vertPreview(c, s){
  const col = T(c).col, reels = c.type==='reels' || c.type==='construction' || c.type==='walkthrough';
  const wrap = el(`<div>
    <div class="vert ${reels?'reels':''}">
      ${reels?'':`<div class="lines"><i></i><i></i><i></i></div>
      <div class="top">
        <div class="ig-av">${esc(CAMPAIGN.initials)}</div>
        <div class="nm">${esc(CAMPAIGN.page)}<span>Sponsored</span></div>
      </div>`}
      <div class="holder"></div>
      ${isVid(c)?`<button class="playbtn" aria-label="Play"><i></i></button>`:''}
      <div class="vfail">This browser blocked playback. Open the file directly in Chrome, or play the source MP4 supplied alongside the deck.</div>
      ${reels?`
      <div class="rrail">
        ${ICONS.heart}${ICONS.comment}${ICONS.send}${ICONS.more}
        <div class="disc">♪</div>
      </div>
      <div class="rcap">
        <div class="who"><span class="av">${esc(CAMPAIGN.initials)}</span>${esc(CAMPAIGN.page)} <span class="sp">· Sponsored</span></div>
        <div class="tx" dir="auto">${esc(String(c.primary||'').replace(/\n/g,' '))}</div>
        <div class="aud">♪ ${esc(firstLine(c.audio)||'Original audio')}</div>
      </div>
      <div class="bottom"><div class="pill">${esc(c.cta||'Call to action')}</div></div>`
      :`
      <div class="bottom">
        <div dir="auto" class="above">${esc(firstLine(c.primary).slice(0,70))}</div>
        <div class="pill">${esc(c.cta||'Call to action')}</div>
      </div>`}
    </div>
    <div class="frame-spec">
      <span class="tag" style="color:${col}">${T(c).label}</span>
      <span>${SPEC[c.ratio]||c.ratio}</span><span>·</span><span>${esc(c.ratio)}</span>
      <span>·</span><span>${esc(c.placement||(reels?'Reels':'Stories'))}</span>
      <button class="ui bare-tog" style="margin-left:auto">Hide ad UI</button>
    </div>
  </div>`);
  wrap.querySelector('.holder').replaceWith(mediaNode(c));

  const tog = wrap.querySelector('.bare-tog'), vt = wrap.querySelector('.vert');
  tog?.addEventListener('click', ()=>{ const b=vt.classList.toggle('bare'); tog.textContent = b?'Show ad UI':'Hide ad UI'; });

  const vid = wrap.querySelector('video'), btn = wrap.querySelector('.playbtn'), bad = wrap.querySelector('.vfail');
  if(vid && btn){
    btn.addEventListener('click', ()=>{ ensureVideo(s); const r=vid.play(); if(r&&r.catch) r.catch(()=>bad.classList.add('on')); });
    /* the ad overlay sits where the native control bar renders, so clear it
       while the film plays and put it back on pause */
    vid.addEventListener('play',  ()=>{ btn.classList.add('gone'); vt.classList.add('bare'); bad.classList.remove('on'); });
    vid.addEventListener('pause', ()=>{ btn.classList.remove('gone'); if(tog && !tog.textContent.startsWith('Show')) vt.classList.remove('bare'); });
    vid.addEventListener('ended', ()=> btn.classList.remove('gone'));
    vid.addEventListener('error', ()=> bad.classList.add('on'));
  } else if(btn){ btn.remove(); }
  return wrap;
}

/* ---------- one creative = one slide ---------- */
function creativeSlide(c){
  if(c.type==='brochure') return brochureSlide(c);
  if(c.type==='flipbook') return flipbookSlide(c);
  if(c.type==='gallery') return gallerySlide(c);
  const col = T(c).col;
  const tall = c.ratio==='9:16';
  const s = el(`<section class="slide" style="--accent:${col}"></section>`);
  const wrap = el(`<div class="ad-layout ${tall?'tall':''}"></div>`);
  const preview = (c.type==='reels'||c.type==='story'||c.type==='construction'||c.type==='walkthrough') ? vertPreview(c,s) : feedPreview(c);

  const cards = (c.type==='carousel'||c.type==='wati') ? (c.cards&&c.cards.length?c.cards:[]) : [];
  const video = c.type==='reels' || c.type==='story' || c.type==='construction' || c.type==='walkthrough';

  /* Finished client artwork carries its copy baked into the design, so a
     creative with no ad-copy fields renders "clean": just the design and a
     Download action — no caption mock, no copy counters, no file name. */
  const cardsHaveCopy = cards.some(cd => has(cd.primary)||has(cd.headline)||has(cd.description));
  const CLEAN = !has(c.primary) && !has(c.headline) && !has(c.description)
                && !has(c.hook) && !has(c.onscreen) && !has(c.audio) && !cardsHaveCopy;
  if(CLEAN){
    preview.querySelector('.ig-cap')?.remove();
    preview.querySelector('.cta-bar')?.remove();
    preview.querySelector('.bare-tog')?.remove();
    preview.querySelector('.vert')?.classList.add('bare');
  }

  const panel = CLEAN ? el(`<div class="panel">
    <div class="eyebrow ${has(c.added)?'dated':''}">${esc(c.id)} · ${esc(T(c).long)}${has(c.added)?`<span class="when">${esc(c.updated&&c.updated!==c.added?'Updated '+c.updated:'Added '+c.added)}</span>`:''}</div>
    <h2 dir="auto">${esc(c.name)}</h2>
    <div class="acts">
      ${has(c.src)?'<button class="ui solid download">Download</button>':''}
      ${cards.length?'<button class="ui solid dlcards">Download</button>':''}
      <button class="ui gohome">All creatives</button>
    </div>
  </div>`) : el(`<div class="panel">
    <div class="eyebrow ${has(c.added)?'dated':''}">${esc(c.id)} · ${esc(T(c).long)}${has(c.added)?`<span class="when">${esc(c.updated&&c.updated!==c.added?'Updated '+c.updated:'Added '+c.added)}</span>`:''}</div>
    <h2 dir="auto">${esc(c.name)}</h2>

    ${video?`
    <div class="field"><div class="flabel">Hook · first 3 seconds</div>
      <div class="fbody ${has(c.hook)?'':'ph'}">${has(c.hook)?esc(c.hook):'What stops the scroll.'}</div></div>
    <div class="field"><div class="flabel">On-screen text</div>
      <div dir="auto" class="fbody ${has(c.onscreen)?'':'ph'}">${has(c.onscreen)?esc(c.onscreen):'Frame-by-frame supers.'}</div></div>
    <div class="field"><div class="flabel">Audio</div>
      <div class="fbody ${has(c.audio)?'':'ph'}">${has(c.audio)?esc(c.audio):'Track, VO or original audio.'}</div></div>`:''}

    <div class="field">
      <div class="flabel">Primary text ${counter(c.primary, LIMITS.primary)}</div>
      <div dir="auto" class="fbody">${truncated(c.primary, LIMITS.primary)}</div>
      ${(c.primary||'').length>LIMITS.primary?`<div class="cut-mark" style="margin-top:8px">Grey text sits behind “… more”</div>`:''}
    </div>
    <div class="field">
      <div class="flabel">Headline ${counter(c.headline, LIMITS.headline)}</div>
      <div dir="auto" class="fbody ${has(c.headline)?'':'ph'}">${has(c.headline)?esc(c.headline):'Headline goes here.'}</div>
    </div>
    <div class="field">
      <div class="flabel">Description ${counter(c.description, LIMITS.description)}</div>
      <div dir="auto" class="fbody ${has(c.description)?'':'ph'}">${has(c.description)?esc(c.description):'Description goes here.'}</div>
    </div>
    ${cards.length?`<div class="field" style="border-bottom:0;padding-bottom:6px">
      <div class="flabel">Cards · ${cards.length}</div></div>
      <div class="cardlist">${cards.map((cd,i)=>`
        <div class="ci ${i?'':'on'}" data-card="${i}">
          <div class="k">${String(i+1).padStart(2,'0')}</div>
          <div><b dir="auto">${esc(cd.headline||'Card headline')}</b>
               <span dir="auto">${esc(cd.description||cd.note||'Card description')}</span></div>
        </div>`).join('')}</div>`:''}
    <div class="field" ${cards.length?'style="border-top:1px solid var(--line)"':''}>
      <div class="flabel">Notes</div>
      <div class="fbody ${has(c.notes)?'':'ph'}">${has(c.notes)?esc(c.notes):'No notes yet.'}</div>
    </div>

    <div class="chips">
      <span class="chip" style="background:${col};color:#fff">${esc(T(c).long)}</span>
      ${has(c.angle)?`<span class="chip">${esc(c.angle)}</span>`:''}
      ${has(c.set)?`<span class="chip">${esc(c.set)}</span>`:''}
      <span class="chip" style="background:transparent;border:1px solid var(--line)">${esc(c.file||'file pending')}</span>
      ${has(CAMPAIGN.destination)?`<span class="chip">${esc(CAMPAIGN.destination)}</span>`:''}
      ${has(c.src)||cards.some(x=>has(x.src))?'':`<span class="chip" style="background:var(--amber);color:#fff">Asset pending</span>`}
    </div>
    <div class="acts">
      <button class="ui copy">Copy ad copy</button>
      ${has(c.src)||cards.some(x=>has(x.src))?'<button class="ui download">Download</button>':''}
      <button class="ui gohome">All creatives</button>
    </div>
  </div>`);

  panel.querySelector('.dlcards')?.addEventListener('click', ()=>{
    (c.cards||[]).forEach((cd,i)=>{ if(has(cd.src)) setTimeout(()=>downloadAsset(cd.src, `${c.id}-slide-${i+1}.png`), i*180); });
    toast('Downloading slides');
  });
  panel.appendChild(feedbackSection(c));
  panel.querySelector('.copy')?.addEventListener('click', ()=>{
    const lines = [`Primary text:\n${c.primary||''}`,`Headline:\n${c.headline||''}`,
                   `Description:\n${c.description||''}`,`CTA: ${c.cta||''}`];
    if(cards.length) lines.push('Cards:\n'+cards.map((cd,i)=>`${i+1}. ${cd.headline||''} — ${cd.description||''}`).join('\n'));
    navigator.clipboard?.writeText(lines.join('\n\n')).then(()=>toast('Ad copy copied'),()=>toast('Copy blocked by browser'));
  });
  panel.querySelector('.gohome').addEventListener('click', goHome);

  /* keep the card list and the carousel in step, both ways */
  let curCard = 0;
  if(cards.length && preview.goto){
    const items=[...panel.querySelectorAll('.ci')];
    items.forEach(it=>it.addEventListener('click',()=>preview.goto(+it.dataset.card)));
    preview.addEventListener('card', e=>{ curCard = e.detail; items.forEach((it,n)=>it.classList.toggle('on', n===e.detail)); });
  }

  panel.querySelector('.download')?.addEventListener('click', ()=>{
    if(cards.length){
      const cd = cards[curCard]||{};
      downloadAsset(cd.src, baseName(cd.file, `${c.id}-card-${curCard+1}.jpg`));
      toast(`Downloading card ${curCard+1}`);
    } else if(isVid(c)){
      downloadAsset(blobFor(c), baseName(c.file, `${c.id}.mp4`));
      toast('Downloading video');
    } else {
      downloadAsset(c.src, baseName(c.file, `${c.id}.jpg`));
      toast('Downloading image');
    }
  });

  wrap.append(preview, panel);
  s.appendChild(wrap);
  s.dataset.title = `${c.id} — ${c.name||''}`;
  s.dataset.type  = c.type;
  return s;
}

  if(flipSection) host.appendChild(flipSection);

  /* every social format shares one section and one grid, ordered by ORDER
     (stills → carousels → stories → reels → …); each thumb carries its type
     for the filter row and its own type colour */
  if(regularTypes.length){
    const kids = byNewest(CREATIVES.filter(c=>regularTypes.includes(c.type)));  /* same-day ties follow CREATIVES order, newest entries placed first */

    /* social creatives are grouped by month (added date, else updated), newest month first */
    const _mk = c => { const v=String(c.added||c.updated||'').trim().match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})$/); return v ? Number(v[3])*100+(_MON[v[2].toLowerCase()]||0) : 0; };
    const _MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const _byMonth = new Map();
    kids.forEach(c=>{ const k=_mk(c); if(!_byMonth.has(k)) _byMonth.set(k,[]); _byMonth.get(k).push(c); });
    const _months = [..._byMonth.keys()].sort((a,b)=>(b||-1)-(a||-1));
    g.querySelector('.bgrid').remove();
    _months.forEach(k=>{

      const pic = (c.type==='carousel'||c.type==='wati') ? ((c.cards||[]).find(x=>has(x.src))||{}).src
                : isVid(c) ? (c.poster||'') : c.src;
      const badge = (c.type==='reels'||c.type==='construction'||c.type==='walkthrough') ? ICONS.film : (c.type==='carousel'||c.type==='wati') ? ICONS.cards

      const t2 = el(`<button class="thumb" data-go="${c.id}" style="--tcol:${TYPES[t].col}">
        <span class="rib"></span><span class="tlab">${esc(TYPES[t].label)}</span>
        <div class="pic">${has(pic)?'':'<div class="blank">Asset pending</div>'}</div>
        ${badge?`<span class="badge">${badge}${(c.type==='carousel'||c.type==='wati')&&c.cards?`<span>${c.cards.length}</span>`:''}</span>`:''}
        <div class="cap"><b>${esc(c.id)}</b><span dir="auto">${esc(c.name||'Untitled')}</span>${has(c.added)?`<span class="when">${esc(c.added)}</span>`:''}</div>
      </button>`);
      if(has(pic)) t2.querySelector('.pic').appendChild(lazyImg(pic, c.name||c.id));
      t2.dataset.t = t;
      t2.addEventListener('click', ()=>goToCreative(c.id));
      grid.appendChild(t2);
    }
    host.appendChild(g);
  }

  const galSection = featSection('gallery', 'Photo gallery');
  if(galSection) host.appendChild(galSection);

  const fbtns=[...s.querySelectorAll('#filters button')];
  fbtns.forEach(b=>b.addEventListener('click',()=>{
    fbtns.forEach(x=>x.classList.toggle('on',x===b));
    const f=b.dataset.f;
    host.querySelectorAll('.bgroup:not(.social)').forEach(g=>g.classList.toggle('hide', f!=='all' && g.dataset.t!==f));
    const soc = host.querySelector('.bgroup.social');
    if(soc){

      soc.querySelectorAll('.thumb').forEach(t=>t.classList.toggle('hide', f!=='all' && t.dataset.t!==f));

    }
  }));

  s.dataset.title='All creatives'; return s;
}

/* ---- admin: the password is never stored or checked against anything in this page.
       It is the encryption key for the GitHub token kept on the admin's own device
       (PBKDF2 -> AES-GCM). Wrong password = token cannot be decrypted = nothing can
       be published. Without the token, the panel cannot change anything for anyone. */
const VAULT_KEY = 'deck-admin-vault';
const enc = new TextEncoder(), dec = new TextDecoder();
const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const b64d = t => Uint8Array.from(atob(t), c=>c.charCodeAt(0));
async function deriveKey(pw, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function vaultStore(pw, token){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pw, salt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(token));
  try{ localStorage.setItem(VAULT_KEY, JSON.stringify({s:b64e(salt), i:b64e(iv), c:b64e(ct)})); }catch(e){}
}
async function vaultOpen(pw){
  let raw = null; try{ raw = localStorage.getItem(VAULT_KEY); }catch(e){}
  if(!raw) return {state:'empty'};
  try{
    const v = JSON.parse(raw);
    const key = await deriveKey(pw, b64d(v.s));
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(v.i)}, key, b64d(v.c));
    return {state:'ok', token: dec.decode(pt)};
  }catch(e){ return {state:'bad'}; }
}

function adminPanel(token){
  const st = p => (LIVE_STATUS && LIVE_STATUS[p.dir]) || p.status || 'live';
  const _admProjects = [...(CAMPAIGN.nav.projects||[])].sort((a,b)=>a.label.toLowerCase().localeCompare(b.label.toLowerCase()));
  const wrap = el(`<div class="admin-veil"><div class="admin">
    <h3>Project visibility</h3>
    ${_admProjects.map(p=>`
      <div class="admin-row"><span>${esc(p.label)}</span>
        <select data-dir="${esc(p.dir)}">
          ${['live','soldout','hidden'].map(v=>`<option value="${v}" ${st(p)===v?'selected':''}>${v==='live'?'Live':v==='soldout'?'Sold out':'Hidden'}</option>`).join('')}
        </select></div>`).join('')}
    <div class="admin-acts">
      <button class="ui a-save solid">Save for everyone</button>
      <button class="ui a-forget">Forget this device</button>
      <button class="ui a-close">Close</button>
    </div>
    <p class="admin-note">Saving publishes via GitHub; changes appear on all devices within ~1 minute.</p>
  </div></div>`);
  document.body.appendChild(wrap);
  wrap.addEventListener('click', e=>{ if(e.target===wrap) wrap.remove(); });
  wrap.querySelector('.a-close').addEventListener('click', ()=>wrap.remove());
  wrap.querySelector('.a-forget').addEventListener('click', ()=>{
    try{ localStorage.removeItem(VAULT_KEY); }catch(e){}
    wrap.remove(); toast('Admin access removed from this device');
  });
  wrap.querySelector('.a-save').addEventListener('click', async ()=>{
    const next = {};
    wrap.querySelectorAll('select').forEach(s=>next[s.dataset.dir]=s.value);
    const api = `https://api.github.com/repos/${SITE.owner}/${SITE.repo}/contents/${SITE.statusPath}`;
    const hdrs = {'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json'};
    try{
      const cur = await (await fetch(api, {headers:hdrs})).json();
      const body = { message:'Update project visibility', content: btoa(JSON.stringify(next, null, 1)), sha: cur.sha };
      const r = await fetch(api, {method:'PUT', headers:hdrs, body: JSON.stringify(body)});
      if(!r.ok) throw new Error((await r.json()).message || r.status);
      LIVE_STATUS = next; renderNav(); wrap.remove(); toast('Saved — live everywhere in ~1 minute');
    }catch(err){ alert('Could not save: ' + err.message); }
  });
}

document.getElementById('adminBtn')?.addEventListener('click', async ()=>{

  if(v.state==='ok'){ adminPanel(v.token); return; }

    // password can never lock the admin out permanently
    if(confirm('Wrong password.\n\nReset admin access on this device? Your stored token will be wiped and you can set up again with your password and GitHub token.')){
      try{ localStorage.removeItem(VAULT_KEY); }catch(e){}
      toast('Reset done — tap the gear again to set up');

    return;
  }
  // first-time setup on this device
  const token = prompt('First-time setup on this device.\nPaste your GitHub token (it will be encrypted with your password and stored only in this browser):');
  if(!token || !token.trim()) return;
  await vaultStore(pw, token.trim());

/* ---------- feedback store ----------
   When FEEDBACK_STORE.token is set, every note is written to the private GitHub repo as its own
   file: feedbacks/<project>/<creative>/<timestamp>-<id>.json — one file per note, so reviewers never
   overwrite each other, and every device sees the same list. With no token it falls back to this
   browser's localStorage, as before. The token is scoped to the feedback repo only (Contents). */
const FEEDBACK_STORE = { repo:'ranielponesto/decks-feedback', branch:'main', token:'' };
const _fbOnline = ()=> !!(FEEDBACK_STORE.token && FEEDBACK_STORE.repo);
const _fbProject = ()=> (CAMPAIGN.handle||CAMPAIGN.project||'project').toLowerCase().replace(/[^a-z0-9]+/g,'-');
const _fbCache = {};
async function _gh(path, opt={}){
  const r = await fetch('https://api.github.com/repos/'+FEEDBACK_STORE.repo+'/contents/'+path, Object.assign({headers:{
    'Authorization':'Bearer '+FEEDBACK_STORE.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}}, opt));
  if(r.status===404) return null;
  if(!r.ok) throw new Error('GitHub '+r.status);
  return r.json();
}
const _b64u = s => btoa(unescape(encodeURIComponent(s)));
const _u64b = s => decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
function _fbStamp(){ return new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
async function fbList(cid, fresh){
  if(!_fbOnline()){ return (notesLoad()[cid]||[]).map((n,i)=>Object.assign({_local:i}, n)); }
  if(!fresh && _fbCache[cid]) return _fbCache[cid];
  const dir = 'feedbacks/'+_fbProject()+'/'+cid;
  const files = (await _gh(dir+'?ref='+FEEDBACK_STORE.branch)) || [];
  const notes = await Promise.all(files.filter(f=>f.type==='file'&&f.name.endsWith('.json')).map(async f=>{
    try{ const j = await _gh(f.path+'?ref='+FEEDBACK_STORE.branch); const n = JSON.parse(_u64b(j.content)); n._path=f.path; n._sha=f.sha; return n; }catch(e){ return null; }
  }));
  return (_fbCache[cid] = notes.filter(Boolean).sort((a,b)=>String(a.iso).localeCompare(String(b.iso))));
}
async function fbAdd(c, text){
  const note = {text, by:reviewer(), at:_fbStamp(), iso:new Date().toISOString(), creative:c.id, name:c.name||'', project:_fbProject(), page:location.pathname.split('/').pop()||'index.html'};
  if(!_fbOnline()){ const nn=notesLoad(); (nn[c.id]=nn[c.id]||[]).push({text:note.text,by:note.by,at:note.at}); notesSave(nn); return 'local'; }
  const id = note.iso.replace(/[:.]/g,'-')+'-'+Math.random().toString(36).slice(2,7);
  await _gh('feedbacks/'+_fbProject()+'/'+c.id+'/'+id+'.json', {method:'PUT', body:JSON.stringify({
    message:`feedback: ${_fbProject()} ${c.id} by ${note.by}`, branch:FEEDBACK_STORE.branch, content:_b64u(JSON.stringify(note,null,1))})});
  delete _fbCache[c.id]; return 'online';
}
async function fbDelete(cid, n){
  if(!_fbOnline()){ const nn=notesLoad(); (nn[cid]||[]).splice(n._local,1); if(nn[cid]&&!nn[cid].length) delete nn[cid]; notesSave(nn); return; }
  await _gh(n._path, {method:'DELETE', body:JSON.stringify({message:`feedback removed: ${cid}`, sha:n._sha, branch:FEEDBACK_STORE.branch})});
  delete _fbCache[cid];
}

/* all feedback for this project — reads the shared store when online, this device otherwise */
async function fbAll(){
  const out = {};
  if(!_fbOnline()){ const n=notesLoad(); for(const k of Object.keys(n)) out[k]=n[k]; return out; }
  const dir = 'feedbacks/'+_fbProject();
  const cids = ((await _gh(dir+'?ref='+FEEDBACK_STORE.branch))||[]).filter(f=>f.type==='dir').map(f=>f.name);
  for(const cid of cids){ const arr = await fbList(cid, true); if(arr.length) out[cid]=arr; }
  return out;
}
function feedbackText(n){
  let out = `Feedback — ${CAMPAIGN.project} creatives\n${location.href.split('#')[0]}\n`;
  for(const cid of Object.keys(n)){
    const c = CREATIVES.find(x=>x.id===cid);
    out += `\n■ ${cid}${c?' — '+c.name:''}\n`;
    for(const note of n[cid]) out += `  • ${note.text}  (${note.by}, ${note.at})\n`;
  }
  return out;
}
/* ---------- Excel export: builds a real .xlsx in the browser (JSZip, no server) ---------- */
async function feedbackExcel(n){
  const X = s => String(s==null?'':s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const col = i => String.fromCharCode(65+i);
  const head = ['Project','Creative ID','Creative','Reviewer','Feedback','Date'];
  const rows = [];
  for(const cid of Object.keys(n)){
    const c = CREATIVES.find(x=>x.id===cid);
    for(const note of n[cid]){
      const d = note.iso ? new Date(note.iso) : null;
      rows.push([CAMPAIGN.project, cid, (c&&c.name)||note.name||'', note.by, note.text,
        d && !isNaN(d) ? d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : (note.at||'')]);
    }
  }
  const cell = (v,r,i,s) => `<c r="${col(i)}${r}" t="inlineStr" s="${s}"><is><t xml:space="preserve">${X(v)}</t></is></c>`;
  let sd = `<row r="1">${head.map((h,i)=>cell(h,1,i,1)).join('')}</row>`;
  rows.forEach((r,ri)=>{ sd += `<row r="${ri+2}">${r.map((v,i)=>cell(v,ri+2,i,i===4?2:3)).join('')}</row>`; });
  const last = `F${rows.length+1}`;
  const z = new JSZip();
  z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>');
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>');
  z.file('xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Feedback" sheetId="1" r:id="rId1"/></sheets>'+(rows.length?`<definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">Feedback!$A$1:$F$${rows.length+1}</definedName></definedNames>`:'')+'</workbook>');
  z.file('xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>');
  z.file('xl/styles.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0B1F3A"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="4"><xf/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"><alignment vertical="center"/></xf><xf applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf><xf applyAlignment="1"><alignment vertical="top"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>');
  z.file('xl/worksheets/sheet1.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="1" width="24" customWidth="1"/><col min="2" max="2" width="14" customWidth="1"/><col min="3" max="3" width="30" customWidth="1"/><col min="4" max="4" width="18" customWidth="1"/><col min="5" max="5" width="70" customWidth="1"/><col min="6" max="6" width="20" customWidth="1"/></cols><sheetData>'+sd+'</sheetData>'+(rows.length?`<autoFilter ref="A1:${last}"/>`:'')+'</worksheet>');
  const blob = await z.generateAsync({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Feedback - ${CAMPAIGN.project} - ${new Date().toISOString().slice(0,10)}.xlsx`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

let cur=0, lastId=null;

function go(i){
  if(document.fullscreenElement && document.fullscreenElement.classList.contains('doc')) document.exitFullscreen();
  cur=Math.max(0,Math.min(slides.length-1,i));
  slides.forEach((s,n)=>s.classList.toggle('on',n===cur));
  slides[cur].scrollTop=0;
  slides.forEach(s=>{ if(!s.classList.contains('on')) s.querySelectorAll('video').forEach(v=>v.pause()); });
  ensureVideo(slides[cur]);
  cNow.textContent=cur+1;
  railTitle.textContent=slides[cur].dataset.title||'';
  try{ const cid=slides[cur].dataset.cid||'';
    if(!window.__fromHash){
      if(cid){ if(location.hash.slice(1)!==cid) history.pushState(null,'','#'+cid); }
      else if(location.hash){ history.pushState(null,'',location.pathname+location.search); }
    } }catch(e){}
  const t=slides[cur].dataset.type;
  const c=t?TYPES[t].col:'var(--c-photo)';
  railDot.style.background=c; prog.style.background=c;
  prog.style.width=((cur+1)/slides.length*100)+'%';
  markBrowser();
  if(cur===0 && lastId){
    const el0 = slides[0].querySelector('.thumb.here,.feat-card.here');
    if(el0) el0.scrollIntoView({block:'center'});
  }
}
function shareCreative(c){

    navigator.share({title:title, text:text, url:url}).catch(()=>{});
  } else {

      .then(()=>toast('Link copied'),()=>{

  }
}

/* On a brochure or gallery slide the viewer itself gets first claim on ← →:
   step a page/photo if there is one in that direction, otherwise fall
   through to normal slide navigation at the first/last page. */
function viewerOf(slide){
  const t = slide && slide.dataset.type;
  if(t!=='brochure' && t!=='gallery') return null;
  const d = slide.querySelector('.doc');
  return (d && d.goto) ? d : null;
}
function stepViewer(dir){
  const d = viewerOf(slides[cur]);
  if(!d) return false;
  const n = d.cur + dir;
  if(n < 0 || n >= d.count) return false;
  d.goto(n);
  return true;
}
function toggleViewerFullscreen(slide){
  const d = (slide && slide.querySelector('.doc')) || document.documentElement;
  document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen();
}

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')) return;
  const k=e.key.toLowerCase();
  const glb = slides[cur] && slides[cur].lb;
  if(glb && glb.isOpen()){
    if(e.key==='Escape'){ e.preventDefault(); glb.close(); return; }
    if(e.key==='ArrowRight'){ e.preventDefault(); glb.step(1); return; }
    if(e.key==='ArrowLeft'){ e.preventDefault(); glb.step(-1); return; }
  }
  if(k==='b'||(e.key==='Escape'&&!document.fullscreenElement)){ e.preventDefault(); goHome(); return; }
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();
    if(e.key==='ArrowRight' && stepViewer(1)) return; go(cur+1)}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();
    if(e.key==='ArrowLeft' && stepViewer(-1)) return; go(cur-1)}
  if(e.key==='Home')go(0);
  if(e.key==='End')go(slides.length-1);
  if(k==='f'){
    const t=slides[cur] && slides[cur].dataset.type;
    if(t==='brochure'||t==='gallery') toggleViewerFullscreen(slides[cur]);
    else document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
  }
  if(k==='p'){e.preventDefault();slides.forEach(s=>s.classList.add('on'));window.print();setTimeout(()=>go(cur),100)}
});

let tid;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(tid);tid=setTimeout(()=>t.classList.remove('on'),1900);
}
