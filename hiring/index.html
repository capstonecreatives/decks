<style>
:root{--ink:#14181b;--soft:#5b6670;--bg:#f3f4f6;--line:#dfe3e7;--navy:#003850}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 20px 48px;display:grid;grid-template-columns:minmax(0,560px) 1fr;gap:36px;align-items:start}

img.post{width:100%;height:auto;display:block;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}

.meta{font:12px/1.6 ui-monospace,Menlo,monospace;color:var(--soft);letter-spacing:.06em;text-transform:uppercase;margin-bottom:22px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;background:var(--navy);color:#fff;text-decoration:none;font-weight:600}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
