<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>Hiring Post — Capstone App</title>
<link rel="icon" href="../favicon.ico?v=20260924" sizes="256x256" type="image/x-icon">
<style>
:root{--ink:#14181b;--soft:#5b6670;--bg:#f3f4f6;--card:#fff;--line:#dfe3e7;--navy:#003850}
@media(prefers-color-scheme:dark){:root{--ink:#eef1f3;--soft:#9aa6b0;--bg:#0f1418;--card:#161d23;--line:#26303a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 48px;display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:32px;align-items:start}
.back{display:inline-block;margin:0 0 12px;color:var(--soft);text-decoration:none;font-size:14px}.back:hover{color:var(--ink)}
canvas{width:100%;height:auto;display:block;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);background:#2a2a2a}
h1{margin:4px 0 4px;font-size:26px}.sub{color:var(--soft);margin:0 0 18px;font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.row{display:grid;gap:6px}.row label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--soft)}
input[type=text],input[type=email]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=range]{width:100%;accent-color:var(--navy)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
button,.file{font:inherit;padding:11px 18px;border-radius:999px;border:1px solid var(--navy);background:transparent;color:var(--ink);cursor:pointer;font-weight:600;font-size:14px}
button.primary{background:var(--navy);color:#fff}.file input{display:none}
@media(max-width:860px){.wrap{grid-template-columns:1fr}}
</style></head><body>
<div class="wrap">
 <div><a class="back" href="../app/">← Capstone App</a><canvas id="cv" width="1080" height="1350" aria-label="Hiring post preview"></canvas></div>
 <div style="padding-top:28px">
  <h1>Hiring Post</h1>
  <p class="sub">Edit the text and photo — the post updates as you type. Downloads at 2160 × 2700 (4:5).</p>
  <div class="panel">
   <div class="two">
    <div class="row"><label for="fRole">Role</label><input id="fRole" type="text" value="Editor"></div>
    <div class="row"><label for="fTag">Top line</label><input id="fTag" type="text" value="Your Real Estate Partner"></div>
   </div>
   <div class="two">
    <div class="row"><label for="fPre">Small headline</label><input id="fPre" type="text" value="we are"></div>
    <div class="row"><label for="fHead">Big headline</label><input id="fHead" type="text" value="Hiring!"></div>
   </div>
   <div class="two">
    <div class="row"><label for="fCta">Call to action</label><input id="fCta" type="text" value="Submit your CV to"></div>
    <div class="row"><label for="fMail">Email / contact</label><input id="fMail" type="text" value="hr@capstoneproperty.com"></div>
   </div>
   <div class="two">
    <div class="row"><label for="fDim">Darken photo</label><input id="fDim" type="range" min="0" max="0.9" step="0.05" value="0.55"></div>
    <div class="row"><label for="fZoom">Photo zoom</label><input id="fZoom" type="range" min="1" max="1.6" step="0.02" value="1.07"></div>
   </div>
   <div class="two">
    <div class="row"><label for="fY">Photo position (up / down)</label><input id="fY" type="range" min="0" max="100" step="1" value="30"></div>
    <div class="row"><label for="fX">Photo position (left / right)</label><input id="fX" type="range" min="-120" max="120" step="1" value="35"></div>
   </div>
   <label class="chk"><input id="fChair" type="checkbox" checked> Keep the armchair bright (default photo only)</label>
   <div class="acts">
    <label class="file">Replace photo<input id="fPhoto" type="file" accept="image/*"></label>
    <button id="reset" type="button">Reset</button>
    <button id="dl" class="primary" type="button">Download PNG</button>
   </div>
  </div>
 </div>
</div>
<script>
(async function(){
  const F='../brand/assets/fonts/ProximaNova/ProximaNova-';
  const faces=[['Regular',400],['Semibold',600],['Extrabold',800]].map(([n,w])=>new FontFace('PN',`url(${F}${n}.otf)`,{weight:String(w)}));
  await Promise.all(faces.map(f=>f.load().then(x=>document.fonts.add(x)).catch(()=>{})));
  const load=src=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src;});
  const [photo0,chair,logo]=await Promise.all([load('photo.png'),load('photo-chair.png'),load('logo.png')]);
  let photo=photo0, custom=false;
  const $=id=>document.getElementById(id), ids=['fRole','fTag','fPre','fHead','fCta','fMail','fDim','fZoom','fY','fX','fChair'];
  const DEF={}; ids.forEach(i=>DEF[i]=$(i).type==='checkbox'?$(i).checked:$(i).value);
  const cv=$('cv');
  function cover(ctx,img,W,H,posY,zoom,shiftX,alpha){
    const s=Math.max(W/img.width,H/img.height), w=img.width*s, h=img.height*s;
    const x=(W-w)/2, y=(H-h)*posY/100;
    ctx.save(); ctx.globalAlpha=alpha;
    ctx.translate(shiftX,0); ctx.translate(W*0.5,H*0.87); ctx.scale(zoom,zoom); ctx.translate(-W*0.5,-H*0.87);
    ctx.drawImage(img,x,y,w,h); ctx.restore();
  }
  function text(ctx,t,y,size,weight,ls,upper){
    ctx.font=`${weight} ${size}px PN, Arial, sans-serif`; ctx.letterSpacing=(ls*size)+'px';
    ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.fillText(upper?t.toUpperCase():t,540,y);
  }
  function fit(ctx,t,size,weight,ls,maxW){ let s=size; do{ ctx.font=`${weight} ${s}px PN, Arial`; ctx.letterSpacing=(ls*s)+'px'; if(ctx.measureText(t).width<=maxW) break; s-=2; }while(s>20); return s; }
  function draw(scale){
    const c=scale===1?cv:document.createElement('canvas'); c.width=1080*scale; c.height=1350*scale;
    const ctx=c.getContext('2d'); ctx.setTransform(scale,0,0,scale,0,0);
    const v=k=>$(k).value, dim=+v('fDim'), zoom=+v('fZoom'), py=+v('fY'), sx=+v('fX');
    ctx.fillStyle='#2A2A2A'; ctx.fillRect(0,0,1080,1350);
    cover(ctx,photo,1080,1350,py,zoom,sx,1);
    ctx.fillStyle=`rgba(18,18,18,${dim})`; ctx.fillRect(0,0,1080,1350);
    if(!custom && $('fChair').checked) cover(ctx,chair,1080,1350,py,zoom,sx,1);
    ctx.fillStyle='#fff';
    const lw=270, lh=logo.height*lw/logo.width; ctx.drawImage(logo,540-lw/2,84,lw,lh);
    text(ctx,v('fTag'),84+lh+22+19,23,400,.02,true);
    text(ctx,v('fPre'),300+66,84,600,-.01,false);
    const head=v('fHead').toUpperCase(), hs=fit(ctx,head,196,800,-.01,1000);
    text(ctx,head,300+84+4+ (176.4+hs*0.72)/2 +4,hs,800,-.01,false);
    // pill
    const py0=300+84+4+176.4+40, px0=540-333;
    ctx.beginPath(); ctx.roundRect(px0,py0,666,58,29); ctx.fillStyle='rgba(255,255,255,.16)'; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=1; ctx.stroke();
    ctx.fillStyle='#fff'; const rs=fit(ctx,v('fRole').toUpperCase(),34,600,.01,560);
    ctx.font=`600 ${rs}px PN, Arial`; ctx.letterSpacing=(.01*rs)+'px'; ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText(v('fRole').toUpperCase(),px0+34,py0+29+2);
    ctx.beginPath(); ctx.arc(px0+666-7-22,py0+29,22,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='#212721'; ctx.lineWidth=2.4; ctx.lineCap='round'; const ox=px0+666-7-22-12, oy=py0+29-12;
    ctx.beginPath(); ctx.arc(ox+10,oy+10,6.5,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ox+15,oy+15); ctx.lineTo(ox+21,oy+21); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.textBaseline='alphabetic';
    const ms=fit(ctx,v('fMail'),32,400,0,960);
    text(ctx,v('fMail'),1350-42-8,ms,400,0,false);
    text(ctx,v('fCta'),1350-42-8-ms-6-10,31,600,.01,true);
    return c;
  }
  const render=()=>draw(1);
  ids.forEach(i=>$(i).addEventListener('input',render));
  $('fPhoto').addEventListener('change',async e=>{const f=e.target.files[0]; if(!f) return; photo=await load(URL.createObjectURL(f)); custom=true; $('fChair').checked=false; $('fChair').disabled=true; render();});
  $('reset').addEventListener('click',()=>{ids.forEach(i=>{const el=$(i); if(el.type==='checkbox') el.checked=DEF[i]; else el.value=DEF[i];}); photo=photo0; custom=false; $('fChair').disabled=false; $('fPhoto').value=''; render();});
  $('dl').addEventListener('click',()=>{ const c=draw(2); c.toBlob(b=>{const a=document.createElement('a'); a.href=URL.createObjectURL(b); const r=($('fRole').value||'post').trim().replace(/[^A-Za-z0-9]+/g,'-'); a.download=`We-Are-Hiring-${r}.png`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);},'image/png'); });
  render();
})();
</script>
</body></html>
